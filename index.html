<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1020" />
<title>GSM — Grand Syncretic Matrix</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#0b1020; --panel:#12182b; --gold:#d4af37; --text:#e8e6dc; --muted:#9aa3b5; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:Georgia, serif; }
  #app { display:grid; grid-template-rows:52px 1fr 140px; height:100%; }
  header { display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #2a3350; background:#0e1426; }
  header h1 { font-size:14px; color:var(--gold); margin:0; letter-spacing:.08em; }
  header span { font-size:12px; color:var(--muted); }
  #map { height:100%; }
  #rail { background:#0e1426; border-top:1px solid #2a3350; padding:8px 12px; overflow-x:auto; }
  .bands { display:flex; min-width:900px; }
  .band { flex:1; border-right:1px dashed #2a3350; padding:0 6px; }
  .band-label { font-size:10px; color:var(--muted); margin-bottom:6px; }
  .bead { border:1px solid #445; border-radius:14px; padding:4px 8px; font-size:11px; cursor:pointer; background:#182038; color:var(--text); margin:2px; }
  .bead.event { border-color:#e85d04; } .bead.conflict { border-color:#9b5de5; }
  .bead.active { outline:2px solid var(--gold); }
  sup.star { color:var(--gold); cursor:pointer; text-decoration:underline dotted; }
  #overlay { display:none; position:absolute; z-index:1000; width:min(420px,94vw); max-height:calc(100vh - 220px); overflow:auto; top:64px; right:12px; background:var(--panel); border:1px solid var(--gold); border-radius:10px; padding:14px 16px; }
  #overlay.open { display:block; }
  #overlay h3 { margin:0 0 6px; color:var(--gold); }
  #overlay h4 { margin:8px 0 4px; color:var(--gold); font-size:12px; }
  #overlay p, #overlay dd { font-size:13px; }
  #overlay dt { color:var(--muted); font-size:12px; }
  #overlay a { color:#8ecae6; }
  #close { float:right; background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .note { font-size:10px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>GSM STEP 1 — LIVE SLICE</h1>
      <span>Timeline click shows pin · click again hides it · * / ** you discern</span>
    </div>
  </header>
  <div id="map"></div>
  <aside id="overlay">
    <button id="close">×</button>
    <h3 id="o-title"></h3>
    <p id="o-body"></p>
    <dl>
      <dt>Stratum</dt><dd id="o-stratum"></dd>
      <dt>Sources</dt><dd id="o-src"></dd>
      <dt>Resolution</dt><dd id="o-conf"></dd>
    </dl>
    <div id="o-expand"></div>
  </aside>
  <footer id="rail">
    <div class="note">Click a timeline bead to show that node on the map. Click the same bead again to remove it. * / ** expand references. Larger pin = more sources.</div>
    <div class="bands" id="bands"></div>
  </footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="graph.js"></script>
<script>
const G = window.GSM_GRAPH;
const colors = {event:'#e85d04', conflict:'#9b5de5'};
const map = L.map('map').setView([32.4, 44.4], 6);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri · USGS · NOAA (land / water only)',
  maxZoom: 12
}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri place names',
  maxZoom: 12,
  opacity: 0.9
}).addTo(map);
const byId = {};
const markers = {};
function mapStyle(n) {
  const sc = n.source_count || (n.corroboration && n.corroboration.source_count) || 1;
  const radius = Math.min(22, 6 + sc * 3.5) + (n.cls === 'conflict' ? 2 : 0);
  const opacity = Math.min(0.95, 0.45 + sc * 0.12);
  const weight = Math.min(5, 1 + Math.floor(sc / 2));
  return { radius, opacity, weight, sc };
}
function showOnMap(id) {
  const n = byId[id];
  if (!n || markers[id]) return;
  const st = mapStyle(n);
  const m = L.circleMarker([n.lat, n.lon], {
    radius: st.radius,
    color: colors[n.cls] || '#d4af37',
    fillColor: colors[n.cls] || '#d4af37',
    fillOpacity: st.opacity,
    weight: st.weight
  }).addTo(map);
  m.bindTooltip(`${n.title} · ${st.sc} source${st.sc===1?'':'s'}`);
  m.on('click', () => openNode(id, true));
  markers[id] = m;
  const bead = document.getElementById('bead-'+id);
  if (bead) bead.classList.add('active');
  map.flyTo([n.lat, n.lon], Math.max(map.getZoom(), 7));
}
function hideOnMap(id) {
  if (!markers[id]) return;
  map.removeLayer(markers[id]);
  delete markers[id];
  const bead = document.getElementById('bead-'+id);
  if (bead) bead.classList.remove('active');
  document.getElementById('overlay').classList.remove('open');
}
function toggleFromRail(id) {
  if (markers[id]) hideOnMap(id);
  else { showOnMap(id); openNode(id, false); }
}
G.nodes.forEach(n => { n.id = n.node_id; byId[n.node_id] = n; });
G.bands.forEach(b => {
  const col = document.createElement('div');
  col.className = 'band';
  col.innerHTML = `<div class="band-label">${b.label}</div>`;
  (b.ids || []).forEach(id => {
    const n = byId[id]; if (!n) return;
    const bead = document.createElement('button');
    bead.className = 'bead ' + n.cls;
    bead.id = 'bead-' + id;
    bead.appendChild(document.createTextNode(n.title + ' '));
    (n.star || '').split('/').filter(Boolean).forEach(p => {
      const s = document.createElement('sup');
      s.className = 'star'; s.textContent = p;
      s.onclick = ev => { ev.stopPropagation(); if (!markers[id]) showOnMap(id); openNode(id, false); };
      bead.appendChild(s);
    });
    bead.onclick = () => toggleFromRail(id);
    col.appendChild(bead);
  });
  document.getElementById('bands').appendChild(col);
});
function links(arr) {
  if (!arr || !arr.length) return '<p>No links.</p>';
  return '<ul>' + arr.map(r => `<li><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a></li>`).join('') + '</ul>';
}
function openNode(id, fly, focus) {
  const n = byId[id];
  document.getElementById('o-title').textContent = n.title + (n.star ? ' ' + n.star : '');
  document.getElementById('o-body').textContent = n.body || '';
  document.getElementById('o-stratum').textContent = n.stratum || '';
  document.getElementById('o-src').textContent = n.src || '';
  const sc = n.source_count || (n.corroboration && n.corroboration.source_count);
  document.getElementById('o-conf').textContent =
    (n.conf || n.preferred_view || '') +
    (sc ? ` · corroboration: ${sc} sources (marker grows with count)` : '');
  const refs = n.refs || {};
  let html = n.starNote ? `<p>${n.starNote}</p>` : '';
  if (n.competing_claims) {
    html += '<h4>Claims</h4><ul>' + n.competing_claims.map(c =>
      `<li><strong>${c.claim_id}</strong> — ${c.statement}</li>`).join('') + '</ul>';
  }
  if (n.nli_result) {
    html += `<h4>NLI</h4><p>${n.nli_result.label} · ${n.nli_result.rule_reason} · model=${n.nli_result.model}</p>`;
  }
  html += '<h4>* Biblical references</h4>' + links(refs.star);
  html += '<h4>** Broader corpus references</h4>' + links(refs.dstar);
  document.getElementById('o-expand').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  if (fly && markers[id]) map.flyTo([n.lat, n.lon], 7);
}
document.getElementById('close').onclick = () => document.getElementById('overlay').classList.remove('open');
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
